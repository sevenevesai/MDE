name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and generates the detached signatures that
          # latest.json references. Key has no password (empty string).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MDE ${{ github.ref_name }}"
          # Publish latest.json alongside the installers so the in-app updater can find it.
          includeUpdaterJson: true
          releaseBody: |
            Lightweight markdown editor built with Tauri 2 + React + CodeMirror 6 + Milkdown.

            ## Features
            - Raw markdown editing with syntax highlighting and minimap
            - WYSIWYG visual mode with rich text toolbar
            - Multiple tabs with persistent undo history
            - File open/save with native dialogs
            - Formatting toolbar and keyboard shortcuts
            - Word wrap and font size controls
            - Dark theme

            ## Install
            - **Windows**: Download `.msi` or `.exe` installer
            - **macOS**: Download `.dmg`
            - **Linux**: Download `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
